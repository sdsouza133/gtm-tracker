# Keeps the pinned actions and the dependencies current, one grouped pull request a week per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
